name: Stock Monitor Auto Run

on:
  schedule:
    # 国际时间 UTC 1:25 (对应北京时间 9:25) 和 UTC 5:30 (对应北京时间 13:30)
    - cron: '25 1 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch: # 支持手动点击一键运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Monitor Script
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: python monitor.py
